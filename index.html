<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chads Matrix Terminal</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg-dark: #090b0e; --card-bg: #121417; --text-main: #f1f5f9; --text-muted: #6b7280;
            --bull-green: #089981; --bear-red: #f23645; --border-color: #26292e; --accent-blue: #2962ff;
        }
        body { font-family: 'Inter', system-ui, sans-serif; background-color: var(--bg-dark); color: var(--text-main); margin: 0; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background-color: var(--card-bg); border-bottom: 1px solid var(--border-color); }
        .logo { font-size: 22px; font-weight: 800; cursor: pointer; color: white; }
        .search-box { display: flex; gap: 10px; position: relative;}
        .search-input { padding: 10px 15px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-dark); color: white; width: 300px; outline: none; text-transform: uppercase;}
        .search-input:focus { border-color: var(--accent-blue); }
        .btn { background: var(--accent-blue); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .container { max-width: 1400px; margin: 0 auto; padding: 30px; }
        #scanner-view { display: block; } #analyzer-view { display: none; }
        .loading { text-align: center; padding: 100px; font-size: 20px; color: var(--text-muted); display: none;}
        .section-title { margin-top: 20px; margin-bottom: 20px; font-size: 24px; font-weight: 800; color: white; border-bottom: 2px solid var(--border-color); padding-bottom: 10px;}
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .card { background-color: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-color); overflow: hidden; }
        .card-header { padding: 15px 20px; border-bottom: 1px solid var(--border-color); font-size: 18px; font-weight: 800; }
        table { width: 100%; border-collapse: collapse; }
        th { color: var(--text-muted); font-size: 13px; text-align: left; padding: 15px 20px; border-bottom: 1px solid var(--border-color); }
        td { padding: 15px 20px; border-bottom: 1px solid #1a1e23; }
        .clickable-row { cursor: pointer; transition: 0.2s; }
        .clickable-row:hover { background-color: rgba(41, 98, 255, 0.1); }
        .pct-green { color: var(--bull-green); font-weight: bold; } .pct-red { color: var(--bear-red); font-weight: bold; }
        .terminal-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; }
        .stock-title { font-size: 36px; font-weight: 900; margin: 0; } .stock-price { font-size: 28px; font-weight: bold; }
        .ai-box { background: linear-gradient(145deg, rgba(41,98,255,0.1), rgba(9,11,14,1)); border: 1px solid rgba(41,98,255,0.3); border-left: 5px solid var(--accent-blue); padding: 25px; border-radius: 12px; margin-bottom: 25px; line-height: 1.6; }
        .ai-title { font-weight: 800; color: var(--accent-blue); margin-bottom: 10px; display: flex; align-items: center; gap: 8px;}
        .chart-controls { display: flex; gap: 10px; margin-bottom: 15px; }
        .indicator-btn { background: var(--bg-dark); border: 1px solid var(--border-color); color: var(--text-muted); padding: 8px 15px; border-radius: 6px; cursor: pointer; }
        .indicator-btn.active { background: var(--card-bg); color: white; border-color: var(--accent-blue); }
        #tv-chart { width: 100%; height: 600px; background-color: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-color); }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo" onclick="goHome()">⚡ CHADS TERMINAL</div>
        <div class="search-box">
            <input list="stock-list" type="text" id="searchInput" class="search-input" placeholder="Search F&O Stock..." onkeypress="handleSearch(event)">
            <button class="btn" onclick="triggerSearch()">Analyze</button>
        </div>
    </div>

    <div class="container">
        <div id="loading" class="loading">
            <h2>🧠 AI Engine Processing...</h2>
            <p>Fetching 5-Min Intraday Data and calculating Matrix technicals.</p>
        </div>

        <div id="scanner-view">
            <h2 class="section-title">🔥 Market Heat (Top F&O Movers)</h2>
            <div class="grid-container">
                <div class="card">
                    <div class="card-header" style="color: var(--bull-green);">🚀 Top Gainers</div>
                    <table>
                        <thead><tr><th>SYMBOL</th><th>LTP</th><th>CHANGE</th></tr></thead>
                        <tbody id="gainer-body"></tbody>
                    </table>
                </div>
                <div class="card">
                    <div class="card-header" style="color: var(--bear-red);">🩸 Top Losers</div>
                    <table>
                        <thead><tr><th>SYMBOL</th><th>LTP</th><th>CHANGE</th></tr></thead>
                        <tbody id="loser-body"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="analyzer-view">
            <button class="btn" style="background:var(--card-bg); border:1px solid var(--border-color); margin-bottom: 20px;" onclick="goHome()">← Back to Dashboard</button>
            <div class="terminal-header">
                <div>
                    <h1 class="stock-title" id="stockName">--</h1>
                    <div style="color: var(--accent-blue); font-weight: bold; margin-top:5px;">Timeframe: 5 Minutes ⏱️</div>
                </div>
                <div class="stock-price" id="stockPrice">₹--</div>
            </div>
            <div class="ai-box">
                <div class="ai-title">🤖 GEMINI QUANT PREDICTION</div>
                <div id="aiText">Analyzing chart patterns...</div>
            </div>
            
            <div class="chart-controls">
                <button class="indicator-btn" onclick="toggleST(3, this)">ST 10:3</button>
                <button class="indicator-btn" onclick="toggleST(1, this)">ST 10:1</button>
                <button class="indicator-btn" onclick="togglePivots(this)">Pivots</button>
            </div>
            
            <div id="tv-chart"></div>
        </div>
    </div>

    <script>
        const API_BASE_URL = "https://trading-view-lite-engine.onrender.com/api"; 
        let chart = null, candleSeries = null;
        let st3Series = null, st1Series = null;
        let pivotLines = [];
        let currentData = null;

        function goHome() {
            document.getElementById('scanner-view').style.display = 'block';
            document.getElementById('analyzer-view').style.display = 'none';
            document.getElementById('loading').style.display = 'none';
            fetchScanner();
        }

        function handleSearch(e) { if(e.key === 'Enter') triggerSearch(); }
        
        function triggerSearch() {
            let val = document.getElementById('searchInput').value.trim().toUpperCase().replace(/\s/g, '');
            if(val) openAnalyzer(val);
        }

        async function fetchScanner() {
            try {
                const res = await fetch(`${API_BASE_URL}/swing-scanner`);
                const json = await res.json();
                if(json.status === 'success') {
                    renderTable('gainer-body', json.data.top_gainers);
                    renderTable('loser-body', json.data.top_losers);
                }
            } catch (err) { console.error("Scanner Error", err); }
        }

        function renderTable(id, data) {
            let html = "";
            if(data.length === 0) { html = `<tr><td colspan='3'>No data found.</td></tr>`; }
            else {
                data.forEach(item => {
                    let color = item.Percent > 0 ? "pct-green" : "pct-red";
                    let sign = item.Percent > 0 ? '+' : '';
                    html += `<tr class="clickable-row" onclick="openAnalyzer('${item.Symbol}')">
                        <td style="font-weight:bold;">${item.Symbol}</td>
                        <td style="color:var(--text-muted);">₹${item.Price}</td>
                        <td class="${color}">${sign}${item.Percent}%</td>
                    </tr>`;
                });
            }
            document.getElementById(id).innerHTML = html;
        }

        async function openAnalyzer(symbol) {
            document.getElementById('scanner-view').style.display = 'none';
            document.getElementById('analyzer-view').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            document.getElementById('searchInput').value = ''; 

            try {
                const res = await fetch(`${API_BASE_URL}/analyze/${encodeURIComponent(symbol)}`);
                const json = await res.json();

                if(json.status === 'success') {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('analyzer-view').style.display = 'block';
                    
                    const data = json.data;
                    currentData = data; 

                    document.getElementById('stockName').innerText = data.symbol;
                    document.getElementById('stockPrice').innerText = "₹" + data.latest_close;
                    document.getElementById('aiText').innerText = data.ai_prediction;

                    renderTradingViewChart(data.historical_chart_data);
                } else {
                    document.getElementById('loading').style.display = 'none';
                    alert("⚠️ Error: " + json.message);
                    goHome();
                }
            } catch (err) {
                document.getElementById('loading').style.display = 'none';
                alert("Frontend Error: " + err.message);
                goHome();
            }
        }

        function renderTradingViewChart(data) {
            try {
                const chartDom = document.getElementById('tv-chart');
                if (chart) { chart.remove(); chart = null; pivotLines = []; }
                chartDom.innerHTML = ""; 
                
                const uniqueData = [];
                const seenDates = new Set();
                for(let i=0; i<data.length; i++) {
                    if(!seenDates.has(data[i].time)) {
                        seenDates.add(data[i].time);
                        uniqueData.push(data[i]);
                    }
                }

                // 🔥 Time visible true for Intraday!
                chart = LightweightCharts.createChart(chartDom, { 
                    layout: { background: { type: 'solid', color: '#121417' }, textColor: '#d1d4dc', }, 
                    grid: { vertLines: { color: '#2b2b43' }, horzLines: { color: '#2b2b43' }, }, 
                    timeScale: { borderColor: '#2b2b43', rightOffset: 5, timeVisible: true, }, 
                });
                
                candleSeries = chart.addCandlestickSeries({ upColor: '#089981', downColor: '#f23645', borderVisible: false, wickUpColor: '#089981', wickDownColor: '#f23645', });
                candleSeries.setData(uniqueData);
                
                // SuperTrends
                st3Series = chart.addLineSeries({ color: '#f23645', lineWidth: 2, title: 'ST 10:3', visible: false });
                st3Series.setData(uniqueData.filter(d => d.st3 !== null).map(d => ({ time: d.time, value: d.st3 })));
                
                st1Series = chart.addLineSeries({ color: '#ff9800', lineWidth: 1, title: 'ST 10:1', visible: false });
                st1Series.setData(uniqueData.filter(d => d.st1 !== null).map(d => ({ time: d.time, value: d.st1 })));

                chart.timeScale().fitContent();
            } catch (err) {
                console.error("Chart Render Error: ", err);
                alert("Chart System Error: " + err.message);
            }
        }

        function toggleST(p, btn) {
            btn.classList.toggle('active');
            let isAct = btn.classList.contains('active');
            if(p === 3) st3Series.applyOptions({ visible: isAct });
            if(p === 1) st1Series.applyOptions({ visible: isAct });
        }

        function togglePivots(btn) {
            btn.classList.toggle('active');
            let isAct = btn.classList.contains('active');
            
            if(isAct && currentData) {
                const colors = ['#888', '#f23645', '#089981']; // Gray for P, Red for R1, Green for S1
                const keys = ['p', 'r1', 's1'];
                
                keys.forEach((key, i) => {
                    // This uses line-series mapped to each candle time, creating a step effect for pivots
                    const l = chart.addLineSeries({ color: colors[i], lineWidth: 1, lineStyle: 2, crosshairMarkerVisible: false });
                    const lineData = currentData.historical_chart_data
                        .filter(d => d[key] !== null)
                        .map(d => ({ time: d.time, value: d[key] }));
                    l.setData(lineData);
                    pivotLines.push(l);
                });
            } else {
                pivotLines.forEach(l => chart.removeSeries(l));
                pivotLines = [];
            }
        }

        goHome();
    </script>
</body>
</html>
