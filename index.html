<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Matrix 1.0 Terminal</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root { --bg: #090b0e; --card: #121417; --blue: #2962ff; --green: #089981; --red: #f23645; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; }
        .container { padding: 20px; max-width: 1200px; margin: auto; }
        #tv-chart { height: 500px; background: var(--card); border-radius: 10px; border: 1px solid #26292e; }
        .controls { margin-bottom: 15px; display: flex; gap: 10px; }
        .btn { background: #26292e; color: #6b7280; border: 1px solid #333; padding: 8px 15px; cursor: pointer; border-radius: 5px; }
        .btn.active { background: var(--blue); color: white; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        table { width: 100%; border-collapse: collapse; background: var(--card); }
        th, td { padding: 12px; border-bottom: 1px solid #26292e; text-align: left; cursor: pointer; }
        .up { color: var(--green); } .down { color: var(--red); }
    </style>
</head>
<body>
    <div class="container">
        <h1 onclick="location.reload()">⚡ MATRIX 1.0</h1>
        
        <div id="scanner-view">
            <div class="grid">
                <div><h3>🚀 Gainers</h3><table id="g-table"></table></div>
                <div><h3>🩸 Losers</h3><table id="l-table"></table></div>
            </div>
        </div>

        <div id="analyzer-view" style="display:none;">
            <button class="btn" onclick="location.reload()">← Back</button>
            <h2 id="stk-name">--</h2>
            <div class="controls">
                <button id="btnST3" class="btn" onclick="toggleST('st3')">ST 10:3</button>
                <button id="btnST1" class="btn" onclick="toggleST('st1')">ST 10:1</button>
                <button id="btnPivot" class="btn" onclick="togglePivots()">Pivots</button>
            </div>
            <div id="tv-chart"></div>
        </div>
    </div>

    <script>
        const API = "http://localhost:10000/api"; // Render pe push karne ke baad change karna
        let chart, candleSeries, lineST3, lineST1, pLines = [];
        let rawData = [];

        async function fetchScanner() {
            const res = await fetch(`${API}/swing-scanner`);
            const json = await res.json();
            fillTable('g-table', json.data.top_gainers);
            fillTable('l-table', json.data.top_losers);
        }

        function fillTable(id, data) {
            let html = `<tr><th>Symbol</th><th>Price</th><th>%</th></tr>`;
            data.forEach(s => {
                html += `<tr onclick="openAnalyzer('${s.Symbol}')"><td>${s.Symbol}</td><td>${s.Price}</td><td class="${s.Percent>0?'up':'down'}">${s.Percent}%</td></tr>`;
            });
            document.getElementById(id).innerHTML = html;
        }

        async function openAnalyzer(symbol) {
            document.getElementById('scanner-view').style.display = 'none';
            document.getElementById('analyzer-view').style.display = 'block';
            const res = await fetch(`${API}/analyze/${symbol}`);
            const json = await res.json();
            const d = json.data;
            document.getElementById('stk-name').innerText = d.symbol + " - ₹" + d.price;
            renderChart(d);
        }

        function renderChart(data) {
            if (chart) chart.remove();
            chart = LightweightCharts.createChart(document.getElementById('tv-chart'), {
                layout: { background: { color: '#121417' }, textColor: '#d1d4dc' },
                grid: { vertLines: { color: '#2b2b43' }, horzLines: { color: '#2b2b43' } },
            });
            candleSeries = chart.addCandlestickSeries({ upColor: '#089981', downColor: '#f23645' });
            candleSeries.setData(data.chart);
            
            // Markers for SMC BOS
            const markers = data.chart.filter(c => c.bos !== "").map(c => ({
                time: c.time, position: 'aboveBar', color: '#2962ff', shape: 'arrowDown', text: 'BOS'
            }));
            candleSeries.setMarkers(markers);

            // Prepare Lines
            lineST3 = chart.addLineSeries({ color: '#f23645', lineWidth: 2, visible: false });
            lineST3.setData(data.chart.map(c => ({ time: c.time, value: c.st3 })));
            
            lineST1 = chart.addLineSeries({ color: '#ff9800', lineWidth: 1, visible: false });
            lineST1.setData(data.chart.map(c => ({ time: c.time, value: c.st1 })));

            // Save Pivots data to global for toggle
            window.pivotData = data.pivots;
            window.chartData = data.chart;
        }

        function toggleST(type) {
            if(type === 'st3') { lineST3.applyOptions({ visible: !lineST3.options().visible }); document.getElementById('btnST3').classList.toggle('active'); }
            if(type === 'st1') { lineST1.applyOptions({ visible: !lineST1.options().visible }); document.getElementById('btnST1').classList.toggle('active'); }
        }

        function togglePivots() {
            const btn = document.getElementById('btnPivot');
            btn.classList.toggle('active');
            if(btn.classList.contains('active')) {
                const colors = ['#888', '#f23645', '#089981'];
                ['p', 'r1', 's1'].forEach((k, i) => {
                    const l = chart.addLineSeries({ color: colors[i], lineWidth: 1, lineStyle: 2 });
                    l.setData(window.chartData.map(c => ({ time: c.time, value: window.pivotData[k] })));
                    pLines.push(l);
                });
            } else {
                pLines.forEach(l => chart.removeSeries(l));
                pLines = [];
            }
        }

        fetchScanner();
    </script>
</body>
</html>
