<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chads Matrix Terminal</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg-dark: #090b0e; --card-bg: #121417; --text-main: #f1f5f9; --text-muted: #6b7280;
            --bull-green: #089981; --bear-red: #f23645; --border-color: #26292e; --accent-blue: #2962ff;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: var(--text-main); margin: 0; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background-color: var(--card-bg); border-bottom: 1px solid var(--border-color); }
        .logo { font-size: 22px; font-weight: 800; cursor: pointer; }
        .container { max-width: 1400px; margin: 0 auto; padding: 30px; }
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .card { background-color: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-color); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { color: var(--text-muted); font-size: 13px; text-align: left; padding: 15px 20px; border-bottom: 1px solid var(--border-color); }
        td { padding: 15px 20px; border-bottom: 1px solid #1a1e23; cursor: pointer; }
        .pct-green { color: var(--bull-green); } .pct-red { color: var(--bear-red); }
        #tv-chart { width: 100%; height: 600px; margin-top: 20px; background: var(--card-bg); border-radius: 12px; }
        .indicator-btn { background: #1a1e23; border: 1px solid var(--border-color); color: var(--text-muted); padding: 8px 15px; border-radius: 6px; cursor: pointer; margin-right: 10px; }
        .indicator-btn.active { border-color: var(--accent-blue); color: white; background: var(--accent-blue); }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo" onclick="location.reload()">⚡ CHADS MATRIX</div>
    </div>

    <div class="container">
        <div id="scanner-view">
            <h2 style="margin-bottom:20px;">🔥 Market Heat</h2>
            <div class="grid-container">
                <div class="card">
                    <div style="padding:15px; color:var(--bull-green); font-weight:800;">🚀 Gainers</div>
                    <table><tbody id="gainer-body"></tbody></table>
                </div>
                <div class="card">
                    <div style="padding:15px; color:var(--bear-red); font-weight:800;">🩸 Losers</div>
                    <table><tbody id="loser-body"></tbody></table>
                </div>
            </div>
        </div>

        <div id="analyzer-view" style="display:none;">
            <button class="indicator-btn" onclick="location.reload()">← BACK</button>
            <h1 id="stockName" style="margin: 20px 0 10px 0;">--</h1>
            <div class="chart-controls">
                <button id="btnST3" class="indicator-btn" onclick="toggleST(3)">ST 10:3</button>
                <button id="btnST1" class="indicator-btn" onclick="toggleST(1)">ST 10:1</button>
                <button id="btnPivot" class="indicator-btn" onclick="togglePivots()">PIVOTS</button>
            </div>
            <div id="tv-chart"></div>
        </div>
    </div>

    <script>
        const API_BASE_URL = window.location.hostname === 'localhost' ? 'http://localhost:10000/api' : '/api';
        let chart, candleSeries, st3Series, st1Series, pivotLines = [];
        let currentData = null;

        async function fetchScanner() {
            const res = await fetch(`${API_BASE_URL}/swing-scanner`);
            const json = await res.json();
            renderTable('gainer-body', json.data.top_gainers);
            renderTable('loser-body', json.data.top_losers);
        }

        function renderTable(id, data) {
            let html = data.map(item => `
                <tr onclick="openAnalyzer('${item.Symbol}')">
                    <td><b>${item.Symbol}</b></td>
                    <td>₹${item.Price}</td>
                    <td class="${item.Percent > 0 ? 'pct-green' : 'pct-red'}">${item.Percent}%</td>
                </tr>
            `).join('');
            document.getElementById(id).innerHTML = html;
        }

        async function openAnalyzer(symbol) {
            document.getElementById('scanner-view').style.display = 'none';
            document.getElementById('analyzer-view').style.display = 'block';
            const res = await fetch(`${API_BASE_URL}/analyze/${symbol}`);
            const json = await res.json();
            currentData = json.data;
            document.getElementById('stockName').innerText = currentData.symbol;
            initChart(currentData);
        }

        function initChart(data) {
            if (chart) chart.remove();
            const chartDom = document.getElementById('tv-chart');
            chart = LightweightCharts.createChart(chartDom, {
                layout: { background: { color: '#121417' }, textColor: '#d1d4dc' },
                grid: { vertLines: { color: '#26292e' }, horzLines: { color: '#26292e' } },
                timeScale: { borderColor: '#26292e' }
            });

            candleSeries = chart.addCandlestickSeries({ upColor: '#089981', downColor: '#f23645' });
            candleSeries.setData(data.historical_chart_data);

            st3Series = chart.addLineSeries({ color: '#f23645', lineWidth: 2, visible: false });
            st3Series.setData(data.historical_chart_data.map(d => ({ time: d.time, value: d.st3 })));

            st1Series = chart.addLineSeries({ color: '#ff9800', lineWidth: 1, visible: false });
            st1Series.setData(data.historical_chart_data.map(d => ({ time: d.time, value: d.st1 })));

            chart.timeScale().fitContent();
        }

        function toggleST(val) {
            if(val === 3) {
                const isVis = !st3Series.options().visible;
                st3Series.applyOptions({ visible: isVis });
                document.getElementById('btnST3').classList.toggle('active', isVis);
            } else {
                const isVis = !st1Series.options().visible;
                st1Series.applyOptions({ visible: isVis });
                document.getElementById('btnST1').classList.toggle('active', isVis);
            }
        }

        function togglePivots() {
            const btn = document.getElementById('btnPivot');
            btn.classList.toggle('active');
            if(btn.classList.contains('active')) {
                const p = currentData.pivots;
                const colors = ['#888', '#f23645', '#089981'];
                const vals = [p.p, p.r1, p.s1];
                vals.forEach((v, i) => {
                    const l = chart.addLineSeries({ color: colors[i], lineWidth: 1, lineStyle: 2 });
                    l.setData(currentData.historical_chart_data.map(d => ({ time: d.time, value: v })));
                    pivotLines.push(l);
                });
            } else {
                pivotLines.forEach(l => chart.removeSeries(l));
                pivotLines = [];
            }
        }

        fetchScanner();
    </script>
</body>
</html>
